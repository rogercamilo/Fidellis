name: fidellis

services:
  postgres:
    image: postgres:16-alpine
    container_name: fidellis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fidellis}
      POSTGRES_USER: ${POSTGRES_USER:-fidellis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fidellis_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fidellis} -d ${POSTGRES_DB:-fidellis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fidellis-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Storage S3-compatível para dev (equivale ao Cloudflare R2 em prod). Console em :9001.
  minio:
    image: minio/minio:latest
    container_name: fidellis-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:-fidellis}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:-fidellis_dev_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  miniodata:
